[package]
name = "edb-pull"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.30", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
edb-tx = { path = "../edb-tx" }
edb-encoding = { path = "../edb-encoding" }
edb-schema = { path = "../edb-schema" }
edb-transactor = { path = "../edb-transactor" }
base64 = "0.21"
edb-index = { path = "../edb-index" }
