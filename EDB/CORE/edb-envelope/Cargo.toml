[package]
name = "edb-envelope"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
ciborium = { version = "0.2", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
edb-tx = { path = "../edb-tx" }
serde_json = "1"
