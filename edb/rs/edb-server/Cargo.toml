[package]
name = "edb-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
axum = { version = "0.7", features = ["macros", "json", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
base64 = "0.21"
parking_lot = "0.12"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
edb-transactor = { path = "../edb-transactor" }
edb-index = { path = "../edb-index" }
