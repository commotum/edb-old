[package]
name = "edb-encoding"
version = "0.1.0"
edition = "2021"

[dependencies]
unicode-normalization = "0.1"
uuid = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
half = "2"
num-bigint = "0.4"
num-traits = "0.2"
bigdecimal = { version = "0.4", features = ["serde"] }
