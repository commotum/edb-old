[package]
name = "edb-edn"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4"
itertools = "0.13"
bigdecimal = "0.4"
num-bigint = "0.4"
ordered-float = "4"
peg = "0.8"
pretty = "0.12"
uuid = { version = "1", features = ["std"] }
thiserror = "1"
serde = { version = "1", optional = true, features = ["derive"] }

[features]
serde_support = ["serde"]
